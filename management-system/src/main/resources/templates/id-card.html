<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Student ID Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10pt;
            color: #333;
            padding: 30px;
        }
        .card-container {
            max-width: 400px;
            margin: 0 auto;
            border: 2px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #fff;
            text-align: center;
            padding: 15px 10px;
        }
        .school-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 6px;
        }
        .school-name {
            font-size: 14pt;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .school-address {
            font-size: 8pt;
            margin-top: 3px;
            opacity: 0.9;
        }
        .card-title {
            background-color: #e74c3c;
            color: #fff;
            text-align: center;
            padding: 5px;
            font-size: 11pt;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .card-body {
            padding: 15px 20px;
            background-color: #fff;
        }
        .student-photo-section {
            text-align: center;
            margin-bottom: 12px;
        }
        .student-photo {
            width: 90px;
            height: 110px;
            object-fit: cover;
            border: 2px solid #2c3e50;
            border-radius: 6px;
        }
        .photo-placeholder {
            width: 90px;
            height: 110px;
            border: 2px dashed #ccc;
            border-radius: 6px;
            display: inline-block;
            line-height: 110px;
            color: #aaa;
            font-size: 9pt;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }
        .info-table td {
            padding: 5px 2px;
            font-size: 10pt;
            vertical-align: top;
        }
        .info-label {
            font-weight: bold;
            color: #2c3e50;
            width: 45%;
        }
        .info-value {
            color: #333;
        }
        .card-footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 7pt;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card-header">
            <img th:if="${schoolLogo}" th:src="${schoolLogo}" class="school-logo" alt="School Logo"/>
            <div class="school-name" th:text="${schoolName}">School Name</div>
            <div class="school-address" th:text="${schoolAddress}">School Address</div>
        </div>

        <div class="card-title">Student Identity Card</div>

        <div class="card-body">
            <div class="student-photo-section">
                <img th:if="${profilePicture}" th:src="${profilePicture}" class="student-photo" alt="Student Photo"/>
                <div th:unless="${profilePicture}" class="photo-placeholder">Photo</div>
            </div>

            <table class="info-table">
                <tr>
                    <td class="info-label">Name</td>
                    <td class="info-value" th:text="${studentName}">Student Name</td>
                </tr>
                <tr>
                    <td class="info-label">Admission No.</td>
                    <td class="info-value" th:text="${admissionNumber}">ADM001</td>
                </tr>
                <tr>
                    <td class="info-label">Class</td>
                    <td class="info-value" th:text="${classInfo}">10 - A</td>
                </tr>
                <tr>
                    <td class="info-label">Date of Birth</td>
                    <td class="info-value" th:text="${dob}">01-01-2010</td>
                </tr>
                <tr>
                    <td class="info-label">Blood Group</td>
                    <td class="info-value" th:text="${bloodGroup}">N/A</td>
                </tr>
                <tr>
                    <td class="info-label">Father's Name</td>
                    <td class="info-value" th:text="${fatherName}">Father Name</td>
                </tr>
                <tr>
                    <td class="info-label">Emergency Contact</td>
                    <td class="info-value" th:text="${emergencyContact}">N/A</td>
                </tr>
            </table>
        </div>

        <div class="card-footer">
            This card is the property of the school. If found, please return to the school office.
        </div>
    </div>
</body>
</html>
