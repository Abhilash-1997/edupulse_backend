spring:
  application:
    name: school-management-system

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 10000
      max-lifetime: 600000
      pool-name: SchoolManagementHikariCP

  jpa:
    hibernate:
      ddl-auto: update   # change to 'validate' in production
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  websocket:
    allowed-origins: "*"

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

gcp:
  bucket-name: school-management-abhilash


# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production}
  expiration: 86400000  # 1 day in milliseconds

# File Storage
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Video Processing (FFmpeg)
video:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  ffprobe-path: ${FFPROBE_PATH:ffprobe}
  segment-duration: 6          # HLS segment length in seconds
  process-timeout-minutes: 30  # Max time for FFmpeg to finish

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: INFO
    com.school.management: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

app:
  super-admin-password: ${SUPER_ADMIN_PASSWORD:ChangeMe@123}
